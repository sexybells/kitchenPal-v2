# Serves the admin console's Vite build as a single-page app: any path that
# doesn't match a real static file falls back to index.html so client-side
# routing (react-router-dom) handles it, instead of nginx 404ing on refresh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames (Vite default) are immutable — cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
